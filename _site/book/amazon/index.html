<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Catálogo de Productos</h1>
            <input type="text" placeholder="Buscar productos..." class="search-bar">
        </div>
    </header>
    <main>
        <section class="product-grid">
            <div class="product">
                <img src="https://via.placeholder.com/200" alt="Producto 1">
                <h2>Producto 1</h2>
                <p>$19.99</p>
                <button>Agregar al carrito</button>
            </div>
            <div class="product">
                <img src="https://via.placeholder.com/200" alt="Producto 2">
                <h2>Producto 2</h2>
                <p>$24.99</p>
                <button>Agregar al carrito</button>
            </div>
            <div class="product">
                <img src="https://via.placeholder.com/200" alt="Producto 3">
                <h2>Producto 3</h2>
                <p>$15.99</p>
                <button>Agregar al carrito</button>
            </div>
            <div class="product">
                <img src="https://via.placeholder.com/200" alt="Producto 4">
                <h2>Producto 4</h2>
                <p>$29.99</p>
                <button>Agregar al carrito</button>
            </div>
            <div class="product">
                <img src="https://via.placeholder.com/200" alt="Producto 5">
                <h2>Producto 5</h2>
                <p>$12.99</p>
                <button>Agregar al carrito</button>
            </div>
            <div class="product">
                <img src="https://via.placeholder.com/200" alt="Producto 6">
                <h2>Producto 6</h2>
                <p>$9.99</p>
                <button>Agregar al carrito</button>
            </div>
        </section>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2024 Catálogo de Productos. Todos los derechos reservados.</p>
        </div>
    </footer>
</body>
</html>
