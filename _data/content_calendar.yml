#
# Status flow: planned -> building -> ready -> drafted -> published
#   building   the author works on the project in the lab repo
#   ready      set by the AUTHOR when the lab folder is complete (README, NOTES, RESULTS, code)
#   drafted    the article PR is open (scripts set drafted_on and post_path)
#   published  the PR is merged (scripts set published_on)
# Never draft an entry that is not "ready". Check what comes next with:
#   python scripts/next_article.py            (or --status for the whole list)
#   python scripts/next_article.py --mark 1 building
#
# Fields: id, month, title, type (tutorial | review | buying-guide | comparison | guide),
# pillar (a category used on the site), lab_folder (in the lab repo), amazon (Amazon links
# expected), tool (new tool on the Tools page, or false), backlog, status, post_path,
# drafted_on, published_on.

