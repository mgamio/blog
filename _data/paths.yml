# Reading paths for /start-here/. Each post in a path also shows a "Part n of m" bar.
# "posts" are post URLs in reading order. A post should belong to one path only.

- id: interview
  title: Ace the coding interview
  tagline: From Big O to solved interview problems, in the order interviewers expect you to know them.
  for_who: You have a coding interview coming up, or you want to stop freezing on algorithm questions.
  posts:
    - /big-o-notation-analysis-of-algorithms/
    - /data-structures-foundation-efficient-programming/
    - /transform-list-into-hashmap/
    - /tree-data-structure-binary-search-tree/
    - /graphs-depth-first-search/
    - /merge-two-sorted-lists/
    - /number-items-closed-compartments/
    - /shopping-budget-options/
  book:
    title: The Code Interview
    author_book: true
    pitch: Real Java coding interview questions, each solved step by step, with the thinking you are expected to say out loud.
