  # ---------- Google Gemini ----------
  - id: gemini-4-argon
    provider: Gemini
    name: Gemini 4 Argon
    input: 2
    cached: 0.1
    output: 10
    batch: { input: 1, cached: 0.05, output: 5 }
    change: { date: "2026-12-01", input: 4, cached: 0.2, output: 20 }

  - id: gemini-3.8-flash
    provider: Gemini
    name: Gemini 3.8 Flash
    input: 0.75
    cached: 0.075
    output: 3.75
    batch: { input: 0.375, cached: 0.0375, output: 1.875 }
    change: { date: "2027-01-01", input: 1.5, cached: 0.15, output: 7.5 }

  - id: gemini-3.1-pro-preview
