# Site
name: "codersite"
title: "codersite"
header: "Practical Programming for Real Projects and Coding Interviews"
description: "Step-by-step Java and Spring Boot tutorials with complete code, algorithms for coding interviews, clean software design, and free developer tools."
logo: 'assets/images/logo.svg'
favicon: 'assets/images/logo.png'
baseurl: ""
url: "https://codersite.dev"
disqus: 'demowebsite'
include: ["_pages"]
permalink: /:title/

# Free developer tools: one page per tool in _tools/, served at /tools/<name>/
collections:
  tools:
    output: true
    permalink: /tools/:name/
  agent_templates:
    output: true
    permalink: /tools/claude-md-templates/:name/

defaults:
  - scope:
      path: ""
      type: tools
    values:
      layout: tool
  - scope:
      path: ""
      type: agent_templates
    values:
      layout: agent-template

# Authors
authors:
  moises:
    name: Moises Gamio
    display_name: Moises Gamio
    avatar: 'assets/images/author.jpg'
    email: codersitedev@gmail.com
    web: https://codersite.dev
    twitter: https://twitter.com/MoisesGamio
    description: "Software Engineer. Comprehensive experience in all phases of the software development lifecycle for several economic sectors."
  aiAvatar:
    name: Powered by AI
    display_name: Powered by AI & Moises Gamio
    avatar: 'assets/images/aiAvatar.jpg'
    email: codersitedev@gmail.com
    web: https://codersite.dev
    twitter: https://twitter.com/MoisesGamio
    description: ""

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
    
    
# Pagination 
paginate: 6
paginate_path: /page:num/
    
# Other
markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Analytics and ads (loaded with a delay and after consent; see _includes/adsense.html)
ga4_id: "G-R4CM8DTM8S"
google_ads_id: "AW-642735915"
adsense_client: "ca-pub-9154513114335042"

# Amazon Associates (BLOG_AUTOMATION.md §7.0). amazon_tag is the amazon.com tag: while it is
# empty, _includes/product.html shows the product name without a button.
amazon_tag: ""
amazon_tag_de: "mkgv89-21"
amazon_tag_uk: ""
onelink_enabled: false

# Lab repository: every new article links to its project folder (BLOG_AUTOMATION.md §10.2)
lab_repo: "https://github.com/mgamio/labAI"

# Lazy Images ("enabled" or "disabled")
lazyimages: "disabled"

exclude: [changelog.md, LICENSE.txt, README.md, Gemfile, Gemfile.lock, CLAUDE.md, BLOG_AUTOMATION.md]
