<!-- adsbygoogle.js library is loaded once, deferred, by default.html; this slot just queues. -->
<!-- tools in-feed: placed as one card in a card grid. The page needs `adsense: true` in its front matter
     if its layout doesn't load AdSense already. The wrapper hides itself when Google has no ad to show. -->
<div class="feed-ad">
<ins class="adsbygoogle"
     style="display:block"
     data-ad-format="fluid"
     data-ad-layout-key="-fb+5w+4e-db+86"
     data-ad-client="ca-pub-9154513114335042"
     data-ad-slot="9926962999"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>
</div>
<style>
.feed-ad:has(ins[data-ad-status="unfilled"]) {
    display: none;
}
</style>
