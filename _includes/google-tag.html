<!-- Google tag (gtag.js) for GA4 and Google Ads, IDs from _config.yml. The library download is deferred
     (see _includes/adsense.html); these commands queue into dataLayer and run when gtag.js loads.
     _includes/consent-default.html runs before this, so nothing is stored without consent in the EEA. -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.ga4_id }}');
  {%- if site.google_ads_id %}
  gtag('config', '{{ site.google_ads_id }}');
  {%- endif %}
</script>
