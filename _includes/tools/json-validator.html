<div class="jt">
    <div class="jt-toolbar">
        <button type="button" id="jtFormat" class="jt-btn jt-active" title="Ctrl+Enter">Format</button>
        <button type="button" id="jtMinify" class="jt-btn">Minify</button>
        <label>Indent
            <select id="jtIndent">
                <option value="2" selected>2 spaces</option>
                <option value="4">4 spaces</option>
                <option value="tab">Tab</option>
            </select>
        </label>
        <label><input type="checkbox" id="jtSort"> Sort keys</label>
        <span class="jt-spacer"></span>
        <button type="button" id="jtSample" class="jt-btn jt-ghost">Sample</button>
        <button type="button" id="jtClear" class="jt-btn jt-ghost">Clear</button>
    </div>

    <div class="jt-panes">
        <div class="jt-pane">
            <div class="jt-pane-head"><label for="jtInput"><span>Your JSON</span></label></div>
            <textarea id="jtInput" class="jt-input" spellcheck="false" autocapitalize="off" autocomplete="off"
                      placeholder="Paste your JSON here, or click Sample"></textarea>
        </div>
        <div class="jt-pane">
            <div class="jt-pane-head">
                <span>Result</span>
                <button type="button" id="jtCopy" class="jt-small" disabled>Copy</button>
                <button type="button" id="jtDownload" class="jt-small" disabled>Download</button>
            </div>
            <pre id="jtOutput" class="jt-output" aria-label="Formatted JSON"></pre>
        </div>
    </div>

    <div id="jtStatus" class="jt-status" role="status" aria-live="polite">Paste JSON above. It is checked as you type, in your browser.</div>
    <noscript><p class="jt-noscript">This tool needs JavaScript. Everything runs locally in your browser.</p></noscript>
</div>
