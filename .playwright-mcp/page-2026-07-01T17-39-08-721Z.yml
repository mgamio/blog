          - heading "Resources" [level=2] [ref=e90]
          - paragraph [ref=e91]:
            - text: In REST API, a resource is the
            - strong [ref=e92]: information or data
            - text: exposed through the web service. Resources can be entities such as users, suppliers, articles, or any other data entity that can be
            - strong [ref=e93]: uniquely identified
            - text: . Each resource on the Web is typically represented by a
            - link "URL" [ref=e94] [cursor=pointer]:
              - /url: https://en.wikipedia.org/wiki/URL
            - text: (Uniform Resource Locator) or endpoint defining a globally unique address. Giving something a URL turns it into a resource.
          - paragraph [ref=e95]:
