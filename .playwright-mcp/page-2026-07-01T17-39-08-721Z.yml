          - heading "Uniform Interface" [level=3] [ref=e129]
          - paragraph [ref=e130]: "A fundamental principle of REST API is the uniform interface, which establishes a standardized way of interacting with resources. It encompasses several constraints, including:"
          - list [ref=e131]:
            - listitem [ref=e132]:
              - paragraph [ref=e133]: "Identification of resources: Resources should be uniquely identified by URIs."
            - listitem [ref=e134]:
              - paragraph [ref=e135]:
                - strong [ref=e136]: Stateless communication
                - text: ": Each request from the client to the server should contain all the necessary information to process the request without relying on the server’s previous state."
            - listitem [ref=e137]:
              - paragraph [ref=e138]: "Manipulation of resources through representations: Resources can be accessed and modified through representations, such as JSON or XML."
            - listitem [ref=e139]:
              - paragraph [ref=e140]: "Self-descriptive messages: Requests and responses should include sufficient metadata to describe the meaning and format of the data."
            - listitem [ref=e141]:
              - paragraph [ref=e142]: "Hypermedia as the engine of application state (HATEOAS): The API should provide links to related resources, allowing clients to navigate the application’s state."
          - heading "HTTP Methods" [level=3] [ref=e143]
          - paragraph [ref=e144]: "API clients can interact with APIs by sending HTTP methods to perform actions on resources. The four commonly used HTTP methods are:"
          - paragraph [ref=e145]:
            - strong [ref=e146]: GET
          - paragraph [ref=e147]: Retrieves a representation of a resource or a collection of resources.
