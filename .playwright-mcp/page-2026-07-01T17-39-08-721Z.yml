        - generic [ref=e51]:
          - paragraph [ref=e52]:
            - text: In the world of web development, APIs (Application Programming Interfaces) play a vital role in enabling communication and data exchange between different systems. Among the various types of APIs,
            - link "REST" [ref=e53] [cursor=pointer]:
              - /url: https://en.wikipedia.org/wiki/Representational_state_transfer
            - text: (Representational State Transfer) has emerged as a popular architectural style for building web services.
          - paragraph [ref=e54]: This article will delve into the fundamental concepts of REST API, its principles, its benefits in modern web development, and how to design a RESTful API.
          - heading "What is RESTful API?" [level=2] [ref=e55]
          - paragraph [ref=e56]: RESTful API is an interface that two computer systems use to exchange information over the Internet securely. Most enterprise applications must communicate with other internal and third-party applications to perform various tasks. For example, to retrieve food product information.
          - heading "What is an API?" [level=2] [ref=e57]
          - paragraph [ref=e58]: An API is an interface with defined functionalities that a software program presents to other programs and, in the case of web APIs, to the rest of the world via the Internet.
          - paragraph [ref=e59]: APIs are the building blocks that allow interoperability between businesses on the web. Companies implement APIs to expose internal business processes and data to new customers and partners.
          - paragraph [ref=e60]: APIs are how food data containing information about allergens are shared with hundreds of restaurant apps specializing in their presentation to final customers.
          - paragraph [ref=e61]: APIs are also called Contracts, because they are assumed to be unbreakable.
          - paragraph [ref=e62]:
            - text: The party offering up its services through an API is called the
            - strong [ref=e63]: provider
            - text: and the one requesting these services is the
            - strong [ref=e64]: consumer
            - text: .
          - paragraph [ref=e65]: We must create programs (API Servers) that serve data and other programs (API Clients) that consume/manipulate that data, as shown in the following figure.
          - paragraph [ref=e66]:
            - img "api-mesh" [ref=e67]
          - paragraph [ref=e68]: Every company can implement Servers’ and Clients’ APIs using different programming languages, caches, proxies, and security mechanisms. They can choose monolithic or microservices architectures deployed in several application servers or cloud providers.
          - paragraph [ref=e69]:
            - text: "But how can all these heterogeneous components communicate with each other? The only answer is that they use a common language: the same semantics as the"
            - link "HTTP" [ref=e70] [cursor=pointer]:
              - /url: https://en.wikipedia.org/wiki/HTTP
            - text: protocol. In this context, semantic means the interpretation we give every HTTP method.
          - paragraph [ref=e71]: We create a kind of API program called Web Service to support this interoperable machine-to-machine interaction over a network.
          - paragraph [ref=e72]:
            - text: API Servers (providers) -> provides
            - strong [ref=e73]: Resources
            - text: (contains information)
          - paragraph [ref=e74]:
            - text: API Clients (consumers) -> requests
            - strong [ref=e75]: Resources
          - paragraph [ref=e76]: To implement efficiently API Servers or API Clients, you must understand the basic concepts of a REST API.
          - heading "What is REST?" [level=2] [ref=e77]
          - paragraph [ref=e78]: REST is an architectural style that defines a set of guidelines for creating web services. It stands for Representational State Transfer and emphasizes a stateless, client-server communication model.
          - paragraph [ref=e79]: It allows communication between a client (such as a web browser or mobile app) and a server over the HTTP protocol.
          - paragraph [ref=e80]: REST APIs use HTTP (Hypertext Transfer Protocol) as the primary protocol for data transmission and rely on standard operations such as GET, POST, PUT, and DELETE to perform actions on resources.
          - paragraph [ref=e81]: The Hypertext Transfer Protocol (HTTP) is a stateless application-level protocol for distributed, collaborative, hypertext information systems. Stateless in this context means a receiver must not retain the session state from previous requests.
          - blockquote [ref=e82]:
            - paragraph [ref=e83]:
              - text: RESTful APIs are widely used in web and mobile applications due to their simplicity, efficiency, and scalability. They provide a structured way to interact with a system’s data and services using standard web technologies. –
              - link "Restful Web APIs" [ref=e85] [cursor=pointer]:
