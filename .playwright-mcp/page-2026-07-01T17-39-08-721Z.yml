          - heading "Common HTTP Method Properties" [level=3] [ref=e229]
          - paragraph [ref=e230]:
            - strong [ref=e231]: Safe Methods
          - paragraph [ref=e232]:
            - text: A Request method is
            - link "safe" [ref=e233] [cursor=pointer]:
              - /url: https://httpwg.org/specs/rfc9110.html#safe.methods
            - text: when it does not change the state of a resource on the API Server.
          - paragraph [ref=e234]: The GET, HEAD, OPTIONS, and TRACE methods are defined to be safe.
          - paragraph [ref=e235]:
            - strong [ref=e236]: Idempotent Methods
          - paragraph [ref=e237]: A request method is idempotent when multiple identical requests have the same effect on the API Server.
          - paragraph [ref=e238]: The PUT, and DELETE methods are defined to be idempotent.
          - heading "Request and Response" [level=2] [ref=e239]
          - paragraph [ref=e240]:
            - text: REST API requests and responses are typically formatted in
            - link "JSON" [ref=e241] [cursor=pointer]:
              - /url: https://www.json.org/json-en.html
            - text: (JavaScript Object Notation) or XML (eXtensible Markup Language). Requests consist of an HTTP method, headers, and, optionally, a request body containing data. Responses include an HTTP status code indicating the outcome of the request, along with the response body containing the requested resource or an error message.
          - paragraph [ref=e242]: "Common error HTTP status codes include:"
          - list [ref=e243]:
            - listitem [ref=e244]:
              - paragraph [ref=e245]: 400 Bad Request. This means that client-request input is not well-formed. The response body will include an error providing further information.
            - listitem [ref=e246]:
              - paragraph [ref=e247]: 401 Unauthorized. Missing or incorrect authentication credentials.
            - listitem [ref=e248]:
              - paragraph [ref=e249]: 403 Forbidden. This means the user is authenticated, but it’s not allowed to access a resource.
            - listitem [ref=e250]:
              - paragraph [ref=e251]: 404 Not Found. The requested resource could not be found but may be available in the future.
            - listitem [ref=e252]:
              - paragraph [ref=e253]: 405 Method Not Allowed. Indicates that the method received in the request-line is known by the origin server but not supported by the target resource.
            - listitem [ref=e254]:
              - paragraph [ref=e255]: 406 Not Acceptable. Returned when an invalid format is specified in the request
            - listitem [ref=e256]:
              - paragraph [ref=e257]: 429 Too Many Requests. Indicates the user has sent too many requests in a given amount of time (“rate limiting”).
            - listitem [ref=e258]:
              - paragraph [ref=e259]: 500 Internal Server Error. Something is broken.
