<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&family=IBM+Plex+Sans:wght@500;600;700&display=block">
<style>
  /* Featured image template for scripts/featured_image.py, 1200 x 630 (BLOG_AUTOMATION.md §8.5).
     Parameters in the URL: ?title=...&kicker=...  (render with headless Edge). */
  html, body { margin: 0; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #F6F8FB; font-family: "IBM Plex Sans", "Segoe UI", sans-serif; }
  .band { position: absolute; left: 0; top: 0; bottom: 0; width: 400px; background: #194175; clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%); }
  .band svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .accent { position: absolute; top: 0; bottom: 0; left: 352px; width: 16px; background: #F39200; transform: skewX(-9deg); transform-origin: top; }
  .kit { position: absolute; left: 70px; top: 150px; width: 200px; height: auto; }
  .content { position: absolute; left: 440px; top: 0; bottom: 0; width: 700px; display: flex; flex-direction: column; justify-content: center; }
  .kicker { margin: 0; font: 500 24px "JetBrains Mono", Consolas, monospace; color: #B86E00; letter-spacing: .5px; }
  h1 { margin: 14px 0 0; font-weight: 700; color: #194175; letter-spacing: -0.5px; line-height: 1.12; }
  .url { position: absolute; left: 440px; bottom: 40px; margin: 0; font: 500 24px "JetBrains Mono", Consolas, monospace; color: #194175; }
  .url b { color: #F39200; font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <div class="band">
    <svg viewBox="0 0 400 630" preserveAspectRatio="none" aria-hidden="true">
      <g fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3">
        <polygon points="80,-40 165,9 165,107 80,156 -5,107 -5,9"/>
        <polygon points="280,330 365,379 365,477 280,526 195,477 195,379"/>
        <polygon points="60,480 145,529 145,627 60,676 -25,627 -25,529"/>
      </g>
    </svg>
  </div>
  <div class="accent"></div>
  <img class="kit" src="../../assets/images/brand/kit-the-code-fox.svg" alt="">
  <div class="content">
    <p class="kicker" id="kicker"></p>
    <h1 id="title"></h1>
  </div>
  <p class="url">codersite<b>.</b>dev</p>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const title = q.get("title") || "Post title";
  document.getElementById("kicker").textContent = "// " + (q.get("kicker") || "codersite.dev");
  const h1 = document.getElementById("title");
  h1.textContent = title;
  // Shrink long titles so they fit in at most 4 lines
  let size = title.length > 70 ? 54 : title.length > 45 ? 62 : 70;
  h1.style.fontSize = size + "px";
  while (h1.scrollHeight > size * 1.12 * 4 + 4 && size > 36) { size -= 2; h1.style.fontSize = size + "px"; }
</script>
</body>
</html>
